<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="flow-title flow-description">
  <title id="flow-title">用中文回复，只需三步</title>
  <desc id="flow-description">第一步，Ctrl+T 呼出快捷输入，输入中文并选择英语或韩语，也可通过 Tab、方向键、Tab 选择并填入本地短句候选。第二步，Enter 翻译并复制；Ctrl+Tab 切换语言，Esc 收起。第三步，回游戏粘贴译文并自行发送。快捷输入不会自动发出译文。操作流程示意，非游戏截图。</desc>
  <style>
    text { font-family: "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #26213D; }
    .heading { font-size: 24px; font-weight: 700; }
    .step-title { font-size: 22px; font-weight: 700; }
    .body { font-size: 19px; }
    .detail { font-size: 16px; fill: #554B70; }
    .number { font-size: 18px; font-weight: 700; fill: #FFFFFF; text-anchor: middle; }
    .key { font-weight: 700; fill: #6034C3; }
    .footer { font-size: 16px; fill: #655A7C; text-anchor: middle; }
  </style>
  <rect width="1200" height="320" rx="16" fill="#F4F0FC"/>
  <text class="heading" x="32" y="38">用中文回复，只需三步</text>

  <rect x="32" y="60" width="352" height="202" rx="12" fill="#FFFFFF" stroke="#DCD2EF"/>
  <circle cx="63" cy="94" r="15" fill="#7547D9"/>
  <text class="number" x="63" y="100">1</text>
  <text class="step-title" x="89" y="101">呼出并输入</text>
  <text class="body" x="52" y="140"><tspan class="key">Ctrl+T</tspan><tspan> 呼出，输入中文</tspan></text>
  <text class="body" x="52" y="170">选择英语或韩语。</text>
  <text class="detail" x="52" y="210">也可从本地短句候选选择：</text>
  <text class="detail" x="52" y="238">Tab 进入 → ↑↓ 选择 → Tab 填字</text>

  <path d="M394 160h20m-7-7 7 7-7 7" fill="none" stroke="#8C73B5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="424" y="60" width="352" height="202" rx="12" fill="#FFFFFF" stroke="#DCD2EF"/>
  <circle cx="455" cy="94" r="15" fill="#7547D9"/>
  <text class="number" x="455" y="100">2</text>
  <text class="step-title" x="481" y="101">翻译并复制</text>
  <text class="body" x="444" y="140">按 <tspan class="key">Enter</tspan><tspan> 翻译并复制译文。</tspan></text>
  <text class="body" x="444" y="181"><tspan class="key">Ctrl+Tab</tspan><tspan> 切换英／韩</tspan></text>
  <text class="body" x="444" y="216"><tspan class="key">Esc</tspan><tspan> 收起输入条</tspan></text>

  <path d="M786 160h20m-7-7 7 7-7 7" fill="none" stroke="#8C73B5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="816" y="60" width="352" height="202" rx="12" fill="#FFFFFF" stroke="#DCD2EF"/>
  <circle cx="847" cy="94" r="15" fill="#7547D9"/>
  <text class="number" x="847" y="100">3</text>
  <text class="step-title" x="873" y="101">回游戏粘贴发送</text>
  <text class="body" x="836" y="140">切回游戏，粘贴译文。</text>
  <text class="body" x="836" y="170">检查后，由你自行发送。</text>
  <text class="detail" x="836" y="218">快捷输入不会自动发出译文。</text>

  <text class="footer" x="600" y="298">操作流程示意，非游戏截图。</text>
</svg>
